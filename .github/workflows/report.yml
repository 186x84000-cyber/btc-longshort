name: 多空比報告

on:
  schedule:
    # GitHub 排程用國際標準時間（UTC），台北時間 = UTC + 8 小時
    # 實測 GitHub 排程約晚 45～60 分鐘才開始，全掃約 85 分鐘，所以提早排
    - cron: '45 21 * * *'      # 台北 05:45 排程 → 約 06:35 開始掃描 → 約 08:00 發早報
    - cron: '10 10 * * *'      # 台北 18:10 排程 → 約 19:00 開始掃描 → 約 20:30 發晚報
    - cron: '5 4,8,16,20 * * *' # 台北 12:05、16:05、00:05、04:05 排程（實際約晚 1 小時），背景檢查，有警報才發
  workflow_dispatch:
    inputs:
      mode:
        description: '執行模式：test＝快速測試，full＝完整報告，core＝警報檢查'
        type: choice
        default: test
        options: [test, full, core]

permissions:
  contents: write

concurrency:
  group: report
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: 安裝中文字型與套件
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          pip install -q -r requirements.txt
      - name: 決定執行模式
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "45 21 * * *" ] || [ "${{ github.event.schedule }}" = "10 10 * * *" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
          else
            echo "mode=core" >> "$GITHUB_OUTPUT"
          fi
      - name: 執行
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python run.py ${{ steps.mode.outputs.mode }}
      - name: 儲存歷史資料
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: ${{ steps.mode.outputs.mode }} $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -q || true
          git push -q || true
      - name: 保存本次圖表
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: charts
          path: out/
          retention-days: 7
          if-no-files-found: ignore
